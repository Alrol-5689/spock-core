spring.application.name=spock-core

server.port=${SPOCK_CORE_PORT:8080}

spring.docker.compose.file=docker-compose.yml

spring.datasource.url=${SPOCK_DATABASE_URL:jdbc:postgresql://localhost:5432/spock}
spring.datasource.username=${SPOCK_DATABASE_USERNAME:spock}
spring.datasource.password=${SPOCK_DATABASE_PASSWORD:spock_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
